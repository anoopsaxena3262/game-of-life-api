name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore GameOfLife.slnx
      - run: dotnet build GameOfLife.slnx -c Release --no-restore
      - run: dotnet test GameOfLife.slnx -c Release --no-build

  # The demo scripts against a running service: every HTTP scenario, then the restart.
  scripts:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/GameOfLife.Api -c Release
      - name: Start the API
        run: |
          dotnet run --project src/GameOfLife.Api -c Release --no-build --launch-profile http > api.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/health/ready && exit 0
            sleep 1
          done
          cat api.log
          exit 1
      - run: ./try-all.sh
      - name: Board survives a kill -9
        run: |
          ./try-restart.sh save
          kill -9 "$(lsof -nP -iTCP:8080 -sTCP:LISTEN -t | head -n 1)"
          sleep 1
          dotnet run --project src/GameOfLife.Api -c Release --no-build --launch-profile http >> api.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/health/ready && break
            sleep 1
          done
          ./try-restart.sh check
      - name: API log
        if: always()
        run: cat api.log
