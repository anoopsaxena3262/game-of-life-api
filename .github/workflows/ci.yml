name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore GameOfLife.slnx
      - run: dotnet build GameOfLife.slnx -c Release --no-restore
      - run: dotnet test GameOfLife.slnx -c Release --no-build
